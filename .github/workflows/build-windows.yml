name: Build Windows Executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "extensions;extensions" --name WindowsOptimizer main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizer-windows-x64
          path: dist/WindowsOptimizer.exe
          if-no-files-found: error
          retention-days: 30
